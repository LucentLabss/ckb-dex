services:
  database:
    image: mongo:7
    restart: unless-stopped
    # Single-node replica set: the backend's ingestion transactions require one.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'database:27017'}]}).ok }"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - MONGO_DB_URL=mongodb://database:27017/ckb-dex?replicaSet=rs0

  faucet:
    build:
      context: .
      dockerfile: faucet/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3100:3100"
    env_file:
      - ./faucet/.env
    environment:
      - NODE_ENV=production
      - MONGO_DB_URL=mongodb://database:27017/ckb-dex-faucet?replicaSet=rs0

volumes:
  mongo-data:
